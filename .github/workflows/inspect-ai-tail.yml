name: Inspect AI integration tail

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print retrieval scoring implementation
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile(next(Path(".").glob("*.zip"))) as z:
              for suffix in ("backend/app/cgfp.py", "backend/tests/test_cgfp_search.py"):
                  n = next(x for x in z.namelist() if x.endswith(suffix))
                  data = z.read(n).decode("utf-8", errors="replace")
                  print(f"===== {n} ({len(data)} chars) =====")
                  print(data[:18000])
          PY
