name: Inspect chatbot kit sources

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract targeted AI and retrieval integration points
        shell: bash
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          archive = next(Path(".").glob("*.zip"))
          targets = {
              "orchestrator.py": 15000,
              "config.py": 9000,
              "test_ai_provider.py": 12000,
              "test_chatbot_v1_smoke.py": 10000,
          }
          with ZipFile(archive) as z:
              for suffix, limit in targets.items():
                  matches = [n for n in z.namelist() if n.endswith(suffix)]
                  for n in matches:
                      data = z.read(n).decode("utf-8", errors="replace")
                      part = data[-limit:] if suffix in {"orchestrator.py", "config.py"} else data[:limit]
                      print(f"===== {n} chars={len(data)} excerpt={len(part)} =====")
                      print(part)
                      print(f"===== END {n} =====")
          PY
