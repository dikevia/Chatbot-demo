name: Inspect selected-source backend flow
on:
  push:
    branches:
      - feat/chat-selected-text-analysis
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect PISTE environment configuration
        run: |
          python - <<'PY'
          import zipfile, pathlib
          zpath = next(pathlib.Path('.').glob('*.zip'))
          with zipfile.ZipFile(zpath) as z:
            for n in z.namelist():
              if n.endswith('.py') and ('backend/app/' in n or 'backend/tests/' in n):
                try:
                  lines = z.read(n).decode('utf-8').splitlines()
                except Exception:
                  continue
                hits = [(i, line) for i, line in enumerate(lines, 1)
                        if any(k in line.lower() for k in ('legifrance_environment', 'legifrance_client_id',
                           'legifrance_client_secret', 'legifrance_scope', 'env_prefix', 'base_settings'))]
                if hits:
                  print('\\n===== ' + n + ' =====')
                  for i, line in hits:
                    lo, hi = max(1, i-3), min(len(lines), i+3)
                    for number in range(lo, hi+1):
                      print(f'{number}: {lines[number-1]}')
          PY
