name: Inspect chatbot kit sources

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and print chatbot integration points
        shell: bash
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          archive = next(Path(".").glob("*.zip"))
          with ZipFile(archive) as z:
              names = z.namelist()
              print("=== SOURCE FILES ===")
              for n in names:
                  if n.endswith((".py", "requirements.txt")) and (
                      "/app/" in n or "/backend/" in n or n.endswith("requirements.txt")
                  ):
                      print(n)
              wanted = ("orchestrator.py", "ai_provider.py", "main.py", "config.py", "schemas.py", "requirements.txt")
              for n in names:
                  if n.endswith(wanted):
                      data = z.read(n).decode("utf-8", errors="replace")
                      print(f"\\n===== BEGIN {n} ({len(data)} chars) =====")
                      print(data[:30000])
                      print(f"===== END {n} =====")
          PY
