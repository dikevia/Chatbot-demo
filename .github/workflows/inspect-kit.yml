name: Inspect selected-source backend flow
on:
  push:
    branches:
      - feat/chat-selected-text-analysis
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Légifrance connector source from developer kit
        run: |
          python - <<'PY'
          import zipfile, pathlib
          zpath = next(pathlib.Path('.').glob('*.zip'))
          needles = ('legifrance.py', 'jurisprudence.py', 'secure_main.py', 'settings.py')
          with zipfile.ZipFile(zpath) as z:
            names = [n for n in z.namelist() if n.endswith('.py') and any(k in n.lower() for k in needles)]
            for n in names:
              print('\\n===== ' + n + ' =====')
              try:
                print(z.read(n).decode('utf-8'))
              except Exception as e:
                print('READ ERROR', type(e).__name__)
          PY
