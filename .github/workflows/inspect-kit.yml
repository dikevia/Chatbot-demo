name: Inspect packaged chatbot sources
on:
  push:
    branches:
      - feat/chat-selected-text-analysis
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump source files needed for conversation and selected documents
        run: |
          python - <<'PY'
          import zipfile, pathlib
          zpath = next(pathlib.Path('.').glob('*.zip'))
          wanted = [
            'Dikevia_Chatbot_V1_Kit_Developpeur/frontend/app.js',
            'Dikevia_Chatbot_V1_Kit_Developpeur/frontend/chat-logic.js',
            'Dikevia_Chatbot_V1_Kit_Developpeur/frontend/index.html',
            'Dikevia_Chatbot_V1_Kit_Developpeur/backend/dev_main.py',
            'Dikevia_Chatbot_V1_Kit_Developpeur/backend/app/schemas.py',
            'Dikevia_Chatbot_V1_Kit_Developpeur/backend/app/ai_provider.py',
          ]
          with zipfile.ZipFile(zpath) as z:
            for n in wanted:
              print('\\n===== '+n+' =====')
              print(z.read(n).decode('utf-8'))
          PY
