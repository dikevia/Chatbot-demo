name: Inspect packaged chatbot sources
on:
  push:
    branches:
      - feat/chat-selected-text-analysis
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect kit structure and chat integration points
        run: |
          python - <<'PY'
          import zipfile, pathlib, re
          zpath = next(pathlib.Path('.').glob('*.zip'))
          with zipfile.ZipFile(zpath) as z:
              names = z.namelist()
              print("=== FILES ===")
              for n in names:
                  if any(k in n.lower() for k in ("backend", "frontend", "app.js", "index.html", "orchestrator", "ai_provider", "main.py")):
                      print(n)
              targets = [n for n in names if n.endswith(('.py','.js','.html')) and any(k in n.lower() for k in ("main","api","route","orchestrator","ai_provider","app.js","index.html"))]
              for n in targets:
                  raw = z.read(n)
                  try: s = raw.decode("utf-8")
                  except: continue
                  lines = s.splitlines()
                  matches = [i for i,line in enumerate(lines) if re.search(r'(@app\.|@router\.|add_api_route|fetch\(|selected|selection|sources|conversation_history|/api/|analyze_question|ask)', line, re.I)]
                  if matches:
                      print("\n=== "+n+" ("+str(len(lines))+" lines) ===")
                      shown=set()
                      for i in matches:
                          for j in range(max(0,i-3), min(len(lines),i+5)):
                              if j not in shown:
                                  print(f"{j+1}: {lines[j]}")
                                  shown.add(j)
                          print("---")
          PY
