name: Validate Dikevia demo image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image (no publication)
        run: docker build --tag dikevia-chatbot-demo:test .

      - name: Verify the application refuses to start without secrets
        shell: bash
        run: |
          set -euo pipefail
          if docker run --rm dikevia-chatbot-demo:test; then
            echo "ERREUR : le serveur a démarré sans identifiants de démonstration."
            exit 1
          else
            echo "OK : démarrage refusé en l'absence des identifiants requis."
          fi

      - name: Start container and verify access protection
        shell: bash
        run: |
          set -euo pipefail

          container_id=$(docker run -d \
            -p 8000:8000 \
            -e DIKEVIA_DEMO_USER=ci-demo \
            -e DIKEVIA_DEMO_PASSWORD=ci-only-password-12345678901234567890 \
            dikevia-chatbot-demo:test)

          cleanup() {
            docker logs "$container_id" || true
            docker rm -f "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          authenticated_status=""
          for attempt in $(seq 1 30); do
            authenticated_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --user 'ci-demo:ci-only-password-12345678901234567890' \
              http://127.0.0.1:8000/health || true)
            if [ "$authenticated_status" = "200" ]; then
              break
            fi
            sleep 2
          done

          if [ "$authenticated_status" != "200" ]; then
            echo "Le serveur ne répond pas correctement avec les identifiants de test."
            exit 1
          fi

          home_status=$(curl --silent --output /tmp/dikevia-home.html --write-out '%{http_code}' \
            --user 'ci-demo:ci-only-password-12345678901234567890' http://127.0.0.1:8000/ || true)
          app_js_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user 'ci-demo:ci-only-password-12345678901234567890' http://127.0.0.1:8000/app.js || true)
          app_css_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user 'ci-demo:ci-only-password-12345678901234567890' http://127.0.0.1:8000/app.css || true)
          manifest_status=$(curl --silent --output /tmp/dikevia-manifest.json --write-out '%{http_code}' \
            --user 'ci-demo:ci-only-password-12345678901234567890' http://127.0.0.1:8000/manifest.webmanifest || true)
          worker_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user 'ci-demo:ci-only-password-12345678901234567890' http://127.0.0.1:8000/sw.js || true)
          icon_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user 'ci-demo:ci-only-password-12345678901234567890' http://127.0.0.1:8000/icon.svg || true)
          voice_js_status=$(curl --silent --output /tmp/dikevia-voice.js --write-out '%{http_code}' \
            --user 'ci-demo:ci-only-password-12345678901234567890' http://127.0.0.1:8000/voice.js || true)
          voice_css_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user 'ci-demo:ci-only-password-12345678901234567890' http://127.0.0.1:8000/voice.css || true)
          if [ "$home_status" != "200" ] || [ "$app_js_status" != "200" ] || [ "$app_css_status" != "200" ] || [ "$manifest_status" != "200" ] || [ "$worker_status" != "200" ] || [ "$icon_status" != "200" ] || [ "$voice_js_status" != "200" ] || [ "$voice_css_status" != "200" ]; then
            echo "Interface/PWA incomplète : accueil=$home_status, app.js=$app_js_status, app.css=$app_css_status, manifest=$manifest_status, sw=$worker_status, icône=$icon_status, voix JS=$voice_js_status, voix CSS=$voice_css_status."
            exit 1
          fi
          grep -q 'Dikévia' /tmp/dikevia-home.html
          grep -q 'voice.js' /tmp/dikevia-home.html
          grep -q 'speechSynthesis' /tmp/dikevia-voice.js
          grep -q 'SpeechRecognition' /tmp/dikevia-voice.js
          grep -q '"display": "standalone"' /tmp/dikevia-manifest.json
          echo "OK : interface web, installation PWA et fonctions vocales accessibles."

          render_health_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8000/_render-health || true)
          if [ "$render_health_status" != "200" ]; then
            echo "Route de santé Render incorrecte : réponse attendue 200, reçue $render_health_status."
            exit 1
          fi

          unauthenticated_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8000/health || true)
          if [ "$unauthenticated_status" != "401" ]; then
            echo "Protection incorrecte : réponse attendue 401, reçue $unauthenticated_status."
            exit 1
          fi

          invalid_credentials_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user 'ci-demo:wrong-password' http://127.0.0.1:8000/health || true)
          if [ "$invalid_credentials_status" != "401" ]; then
            echo "Protection incorrecte : mauvais mot de passe, réponse attendue 401, reçue $invalid_credentials_status."
            exit 1
          fi

          echo "OK : démarrage sécurisé, santé Render publique sans données, bons identifiants acceptés, accès anonyme et mauvais mot de passe refusés."
