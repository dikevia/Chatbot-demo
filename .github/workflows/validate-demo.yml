name: Validate Dikevia demo image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image (no publication)
        run: docker build --tag dikevia-chatbot-demo:test .

      - name: Verify the legal-search fallback patch is present
        shell: bash
        run: |
          docker run --rm --entrypoint python dikevia-chatbot-demo:test -c 'from pathlib import Path; p=Path("/app/backend/app/orchestrator.py"); s=p.read_text(encoding="utf-8"); compile(s, str(p), "exec"); assert "has_cgfp_snapshot" in s; assert "Dikévia ne formule donc pas" in s; assert "JURIS ne formule donc pas" not in s; print("OK : articles CGFP locaux conservés en résultats documentaires et nom Dikévia corrigé.")'

      - name: Verify legal concept ranking against the bundled CGFP snapshot
        run: |
          docker run --rm --entrypoint python dikevia-chatbot-demo:test -c 'import sys; sys.path.insert(0, "/app/backend"); from app.cgfp_relevance import search_cgfp; r=search_cgfp("Mon chef m a insulté", limit=8); refs=[x["article"] for x in r["results"]]; print("insultes:", refs); assert "L134-5" in refs[:3], "L134-5 doit être parmi les trois premiers résultats"; assert "L134-10" not in refs, "L134-10 ne doit pas être proposé aux catégories générales"; assert "L133-1" not in refs, "Le harcèlement sexuel ne doit pas remonter sur une question d insultes"; assert r["search_mode"] == "concepts_juridiques"; workload=search_cgfp("Mon chef me menace de me mettre plein de travail sur le dos, beaucoup plus que mes collègues", limit=8); assert "charge_travail_conditions_travail" in workload.get("detected_topics", []), "La surcharge et une charge inégale doivent être reconnues"; assert "L134-10" not in [x["article"] for x in workload["results"]], "L134-10 ne concerne pas les agents territoriaux en général"; d=search_cgfp("Je souhaite contester une sanction disciplinaire", limit=8); assert "discipline" in d.get("detected_topics", []); assert d["results"], "La recherche disciplinaire doit fournir des pistes"; e=search_cgfp("Article L134-5", limit=3); assert e["results"] and e["results"][0]["article"] == "L134-5"; u=search_cgfp("Mon collègue est saoul au travail", limit=8); print("hors sujet:", [(x["article"], x["score"]) for x in u["results"]]); assert not u["results"], "Une question hors sujet ne doit pas recevoir des articles CGFP génériques"; print("OK : concepts juridiques, exclusion hors sujet, références directes et rejet des correspondances lexicales faibles.")'

      - name: Verify Gemini compatibility and safe no-source orientation
        shell: bash
        run: |
          docker run --rm --entrypoint python dikevia-chatbot-demo:test -c 'import sys; sys.path.insert(0, "/app/backend"); from app.config import Settings, validate_runtime_configuration; cfg=Settings(ai_api_base_url="https://generativelanguage.googleapis.com/v1beta/openai", ai_api_key="test-only-not-a-secret", ai_model="gemini-3.8-flash"); validate_runtime_configuration(cfg); from pathlib import Path; p=Path("/app/backend/app/orchestrator.py"); s=p.read_text(encoding="utf-8"); compile(s, str(p), "exec"); assert "_dikevia_general_ai_orientation" in s; assert "sources=[]" in s; assert "Orientation générale et pratique" in s; print("OK : endpoint Gemini accepté et orientation générale sans source juridique présente.")'

      - name: Verify the application refuses to start without secrets
        shell: bash
        run: |
          set -euo pipefail
          if docker run --rm dikevia-chatbot-demo:test; then
            echo "ERREUR : le serveur a démarré sans identifiants de démonstration."
            exit 1
          else
            echo "OK : démarrage refusé en l'absence des identifiants requis."
          fi

      - name: Start container and verify access protection
        shell: bash
        run: |
          set -euo pipefail

          container_id=$(docker run -d \
            -p 8000:8000 \
            -e DIKEVIA_DEMO_USER=ci-demo \
            -e DIKEVIA_DEMO_PASSWORD=ci-only-password-12345678901234567890 \
            dikevia-chatbot-demo:test)

          cleanup() {
            docker logs "$container_id" || true
            docker rm -f "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          authenticated_status=""
          for attempt in $(seq 1 30); do
            authenticated_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --user 'ci-demo:ci-only-password-12345678901234567890' \
              http://127.0.0.1:8000/health || true)
            if [ "$authenticated_status" = "200" ]; then
              break
            fi
            sleep 2
          done

          if [ "$authenticated_status" != "200" ]; then
            echo "Le serveur ne répond pas correctement avec les identifiants de test."
            exit 1
          fi

          home_status=$(curl --silent --output /tmp/dikevia-home.html --write-out '%{http_code}' \
            --user 'ci-demo:ci-only-password-12345678901234567890' http://127.0.0.1:8000/ || true)
          app_js_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user 'ci-demo:ci-only-password-12345678901234567890' http://127.0.0.1:8000/app.js || true)
          app_css_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user 'ci-demo:ci-only-password-12345678901234567890' http://127.0.0.1:8000/app.css || true)
          manifest_status=$(curl --silent --output /tmp/dikevia-manifest.json --write-out '%{http_code}' \
            --user 'ci-demo:ci-only-password-12345678901234567890' http://127.0.0.1:8000/manifest.webmanifest || true)
          worker_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user 'ci-demo:ci-only-password-12345678901234567890' http://127.0.0.1:8000/sw.js || true)
          icon_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user 'ci-demo:ci-only-password-12345678901234567890' http://127.0.0.1:8000/icon.svg || true)
          voice_js_status=$(curl --silent --output /tmp/dikevia-voice.js --write-out '%{http_code}' \
            --user 'ci-demo:ci-only-password-12345678901234567890' http://127.0.0.1:8000/voice.js || true)
          voice_css_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user 'ci-demo:ci-only-password-12345678901234567890' http://127.0.0.1:8000/voice.css || true)
          if [ "$home_status" != "200" ] || [ "$app_js_status" != "200" ] || [ "$app_css_status" != "200" ] || [ "$manifest_status" != "200" ] || [ "$worker_status" != "200" ] || [ "$icon_status" != "200" ] || [ "$voice_js_status" != "200" ] || [ "$voice_css_status" != "200" ]; then
            echo "Interface/PWA incomplète : accueil=$home_status, app.js=$app_js_status, app.css=$app_css_status, manifest=$manifest_status, sw=$worker_status, icône=$icon_status, voix JS=$voice_js_status, voix CSS=$voice_css_status."
            exit 1
          fi
          grep -q 'Dikévia' /tmp/dikevia-home.html
          grep -q 'voice.js' /tmp/dikevia-home.html
          grep -q 'speechSynthesis' /tmp/dikevia-voice.js
          grep -q 'SpeechRecognition' /tmp/dikevia-voice.js
          grep -q '"display": "standalone"' /tmp/dikevia-manifest.json
          echo "OK : interface web, installation PWA et fonctions vocales accessibles."

          render_health_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8000/_render-health || true)
          if [ "$render_health_status" != "200" ]; then
            echo "Route de santé Render incorrecte : réponse attendue 200, reçue $render_health_status."
            exit 1
          fi

          unauthenticated_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8000/health || true)
          if [ "$unauthenticated_status" != "401" ]; then
            echo "Protection incorrecte : réponse attendue 401, reçue $unauthenticated_status."
            exit 1
          fi

          invalid_credentials_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user 'ci-demo:wrong-password' http://127.0.0.1:8000/health || true)
          if [ "$invalid_credentials_status" != "401" ]; then
            echo "Protection incorrecte : mauvais mot de passe, réponse attendue 401, reçue $invalid_credentials_status."
            exit 1
          fi

          echo "OK : démarrage sécurisé, santé Render publique sans données, bons identifiants acceptés, accès anonyme et mauvais mot de passe refusés."


      - name: Assemble Dikévia Android and developer kit
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/Dikevia_Kit
          cp -R Dockerfile README.md cgfp_relevance.py patch_runtime.py pwa render.yaml secure_main.py "Dikevia_Chatbot_V1_Kit_Developpeur (1).zip" dist/Dikevia_Kit/
          cat > dist/Dikevia_Kit/LISEZ-MOI-ANDROID.txt <<'EOF'
          DIKEVIA — KIT DE SAUVEGARDE
          Version construite depuis le dépôt GitHub au moment de la génération.

          INSTALLER L'APPLICATION SUR ANDROID
          1. Ouvrir Chrome sur https://dikevia-chatbot-demo.onrender.com
          2. Se connecter avec les identifiants Dikévia.
          3. Ouvrir le menu ⋮ de Chrome.
          4. Choisir "Installer l'application" ou "Ajouter à l'écran d'accueil".
          5. L'icône Dikévia apparaît sur le téléphone.

          CONFIDENTIALITÉ — LIMITES À CONNAÎTRE
          - Cette PWA ne demande pas l'accès aux photos, fichiers, contacts, SMS ou autres contenus du téléphone.
          - Les questions saisies sont envoyées au serveur Dikévia hébergé sur Render pour obtenir une réponse.
          - Les ressources juridiques peuvent être demandées aux services externes configurés (notamment PISTE/Légifrance en sandbox).
          - La reconnaissance vocale du navigateur peut transmettre l'audio à son fournisseur. Ne pas utiliser le micro pour des informations confidentielles.
          - Le service nécessite Internet. Ce n'est pas une application autonome hors ligne.
          - Ne saisir ni secrets, ni mots de passe, ni données personnelles sensibles ou dossiers nominatifs.
          - Aucun fournisseur d'IA n'est configuré dans cette version.
          - Aucun accès PostgreSQL n'est utilisé par cette démo.

          SAUVEGARDE / MODIFICATION
          - Le dossier contient les fichiers de déploiement et les correctifs de pertinence.
          - L'archive développeur d'origine est incluse.
          - Le dépôt GitHub reste la source modifiable et à jour : https://github.com/dikevia/Chatbot-demo
          - Ce kit ne contient aucun mot de passe ni secret Render/PISTE.
          EOF
          cd dist
          zip -qr Dikevia_Kit_Android_et_Code.zip Dikevia_Kit
      - name: Upload Dikévia kit
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: dikevia-kit-android-code
          path: dist/Dikevia_Kit_Android_et_Code.zip
          if-no-files-found: error
          retention-days: 30
