name: Export chatbot kit for inspection

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-kit.yml"
      - "Dikevia_Chatbot_V1_Kit_Developpeur (1).zip"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract developer kit
        run: |
          test -f "Dikevia_Chatbot_V1_Kit_Developpeur (1).zip"
          mkdir extracted
          unzip -q "Dikevia_Chatbot_V1_Kit_Developpeur (1).zip" -d extracted
      - uses: actions/upload-artifact@v4
        with:
          name: dikevia-chatbot-kit-source
          path: extracted/
          retention-days: 1
