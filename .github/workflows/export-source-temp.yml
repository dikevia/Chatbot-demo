name: Export chatbot source for inspection
on:
  push:
    branches: [main]
permissions:
  contents: read
  actions: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source archive
        run: |
          mkdir -p /tmp/dikevia-source
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile("Dikevia_Chatbot_V1_Kit_Developpeur (1).zip") as z:
              z.extractall("/tmp/dikevia-source")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dikevia-source-inspection
          path: /tmp/dikevia-source/
          retention-days: 1
